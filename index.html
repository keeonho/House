<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dekor Rumah — Drag & Drop</title>
<style>
:root{--cream:#FFF6E8;--warm:#FFFDF6;--line:#E8D9C0;--ink:#6B5340;--soft:#8A6C4E;--wood:#C89A6A;--woodD:#A97F52}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:var(--cream);color:var(--ink);
  display:flex;flex-direction:column}

/* HUD atas */
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--warm);
  border-bottom:2px solid var(--line);flex-shrink:0;z-index:20}
.hbtn{width:38px;height:38px;border-radius:13px;border:2px solid var(--line);background:var(--warm);
  display:grid;place-items:center;font-size:17px;cursor:pointer}
.hbtn:active{transform:scale(.9)}
.htitle{flex:1;min-width:0}
.htitle b{font-size:14.5px;display:block;line-height:1.15}
.htitle small{font-size:10.5px;color:var(--soft)}
.coin{display:flex;align-items:center;gap:4px;background:#FFF3C9;border:2px solid #E8C97A;
  border-radius:12px;padding:5px 9px;font-size:12px;font-weight:800;color:#8A6A2E}

/* panggung */
.stagewrap{flex:1;min-height:0;display:grid;place-items:center;padding:10px;position:relative}
.stage{position:relative;height:100%;aspect-ratio:3/4;max-width:100%;border-radius:20px;overflow:hidden;
  border:2.5px solid var(--line);box-shadow:0 4px 0 rgba(150,110,70,.12);touch-action:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#items{position:absolute;inset:0}
.zoneHint{position:absolute;left:0;right:0;pointer-events:none;opacity:0;transition:opacity .18s}
.zoneHint.on{opacity:1}
.zoneHint.wall{top:0;height:58%;background:rgba(127,179,213,.16);border-bottom:2px dashed rgba(127,179,213,.6)}
.zoneHint.floor{top:58%;bottom:0;background:rgba(111,181,126,.15)}

/* item */
.it{position:absolute;transform-origin:center;cursor:grab;transition:filter .15s}
.it svg{display:block;overflow:visible;pointer-events:none}
.it.sel{filter:drop-shadow(0 0 0 #F0A05A) drop-shadow(0 0 3px #F0A05A)}
.it.drag{cursor:grabbing;filter:drop-shadow(0 6px 6px rgba(107,83,64,.3))}

/* toolbar item terpilih */
.obar{position:absolute;display:flex;gap:5px;background:var(--warm);border:2px solid var(--line);
  border-radius:14px;padding:5px;box-shadow:0 3px 0 rgba(150,110,70,.16);z-index:30;
  opacity:0;pointer-events:none;transform:translate(-50%,-100%) scale(.9);transition:opacity .16s,transform .16s}
.obar.on{opacity:1;pointer-events:auto;transform:translate(-50%,-100%) scale(1)}
.obar button{width:34px;height:34px;border-radius:11px;background:var(--cream);border:none;
  display:grid;place-items:center;font-size:15px;cursor:pointer}
.obar button:active{transform:scale(.86)}
.obar button.del{background:#FFE9E6}

/* bar bawah */
.bottom{flex-shrink:0;background:var(--warm);border-top:2px solid var(--line);z-index:20}
.rooms{display:flex;gap:6px;overflow-x:auto;padding:9px 12px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rm{flex:0 0 auto;padding:7px 13px;border-radius:13px;border:2px solid var(--line);background:var(--warm);
  font-size:12px;font-weight:800;color:var(--soft);cursor:pointer}
.rm.on{background:var(--wood);border-color:var(--woodD);color:#fff}
.acts{display:flex;gap:8px;padding:0 12px 10px}
.act{flex:1;padding:11px;border-radius:14px;border:2px solid var(--line);background:var(--warm);
  font-size:13px;font-weight:800;color:var(--soft);cursor:pointer}
.act.primary{background:linear-gradient(160deg,#F5B471,#EE9440);border-color:#D9822B;color:#fff}
.act:active{transform:scale(.97)}

/* katalog */
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--warm);border-top:2.5px solid var(--line);
  border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(150,110,70,.2);z-index:40;
  transform:translateY(105%);transition:transform .3s cubic-bezier(.34,1.1,.5,1);max-height:62vh;
  display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:9px auto 4px;flex-shrink:0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 8px;flex-shrink:0}
.shead b{font-size:15px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none;flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.ct{flex:0 0 auto;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--warm);
  font-size:11.5px;font-weight:800;color:var(--soft);cursor:pointer}
.ct.on{background:var(--wood);border-color:var(--woodD);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:9px;padding:0 12px 18px;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.ci{background:var(--cream);border:2px solid var(--line);border-radius:14px;padding:7px 4px 8px;text-align:center;cursor:pointer}
.ci:active{transform:scale(.94)}
.ci .th{height:52px;display:grid;place-items:center}
.ci .th svg{width:46px;height:46px;overflow:visible}
.ci .nm{font-size:9.5px;font-weight:800;line-height:1.15;margin-top:2px}
.ci .pr{font-size:9.5px;font-weight:800;color:var(--woodD);margin-top:2px}
.ci .pr.free{color:#4E9E62}
.ci.owned{opacity:.55}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-120%);background:#5A3D1E;color:#FFF6E2;
  font-size:12.5px;font-weight:800;padding:10px 16px;border-radius:99px;z-index:99;transition:transform .3s;max-width:88%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.mask{position:fixed;inset:0;background:rgba(80,60,40,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
.mask.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<div class="hud">
  <button class="hbtn" id="back">‹</button>
  <div class="htitle"><b id="hTitle">Rumah Oniyaww</b><small id="hSub">Ruang Tamu</small></div>
  <div class="coin">🪙 <span id="coin">3.250</span></div>
</div>

<div class="stagewrap">
  <div class="stage" id="stage">
    <svg id="bg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="zoneHint wall" id="zw"></div>
    <div class="zoneHint floor" id="zf"></div>
    <div id="items"></div>
    <div class="obar" id="obar">
      <button id="bFlip" title="Balik">🔁</button>
      <button id="bUp" title="Ke depan">⬆️</button>
      <button id="bDown" title="Ke belakang">⬇️</button>
      <button id="bPhoto" title="Pasang foto" style="display:none">📷</button>
      <button id="bDel" class="del" title="Simpan kembali">🗑️</button>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="rooms" id="rooms"></div>
  <div class="acts">
    <button class="act" id="btnMode">✋ Mode Dekor</button>
    <button class="act primary" id="btnShop">🛋️ Furniture</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead"><b>🛋️ Furniture</b><button class="hbtn" id="closeSheet">✕</button></div>
  <div class="cats" id="cats"></div>
  <div class="cgrid" id="cgrid"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const C={cream:'#FFF6E8',white:'#FFFDF6',line:'#8A6C4E',wood:'#C89A6A',woodD:'#A97F52',woodL:'#E0BE93',
pink:'#F5B7C8',pinkD:'#E294AC',blue:'#A8CFE8',blueD:'#7FB3D5',green:'#9FD8A8',greenD:'#6FB57E',
yellow:'#FFD98A',yellowD:'#E8B85C',lilac:'#C9B6E8',peach:'#F5B78A',grey:'#D8D2C6',leaf:'#7FBF8A',
sky:'#DFF1FA',soil:'#B08968',dark:'#6B5340'};
const L=C.line, st=`stroke="${L}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
const stT=`stroke="${L}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"`;
// Setiap item dikasih lapisan detail: bayangan kontak, kilau, dan guratan tekstur.
// Jadi ga flat lagi tapi gambar aslinya tetap dipakai (bukan digambar ulang).
const SHADOW = ``;
const SHEEN  = ``;
const GRAIN  = ``;
const S=(i,o={})=>`<svg viewBox="0 0 100 100">`
  + (o.noShadow?'':SHADOW) + i
  + (o.noGrain?'':GRAIN) + (o.noSheen?'':SHEEN) + `</svg>`;
const HZ=232;

/* --- latar ruangan --- */
const DEFS=`<defs>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
  <circle cx="6" cy="6" r="2.1" fill="#E7D3BE" opacity=".85"/><circle cx="19" cy="19" r="1.5" fill="#E7D3BE" opacity=".6"/></pattern>
<pattern id="tile" width="30" height="30" patternUnits="userSpaceOnUse">
  <path d="M0 0h30M0 0v30" stroke="rgba(127,179,213,.28)" stroke-width="1.8"/>
  <circle cx="15" cy="15" r="1.8" fill="rgba(127,179,213,.3)"/></pattern>
<pattern id="floral" width="34" height="34" patternUnits="userSpaceOnUse"><g opacity=".5">
  <circle cx="10" cy="10" r="3.2" fill="#EFC9D6"/><circle cx="10" cy="4.5" r="2.2" fill="#F7DDE5"/>
  <circle cx="10" cy="15.5" r="2.2" fill="#F7DDE5"/><circle cx="4.5" cy="10" r="2.2" fill="#F7DDE5"/>
  <circle cx="15.5" cy="10" r="2.2" fill="#F7DDE5"/></g></pattern>
<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CFE9F7"/><stop offset="100%" stop-color="#EAF6FB"/></linearGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#000" stop-opacity=".07"/><stop offset="35%" stop-color="#000" stop-opacity="0"/></linearGradient>
</defs>`;
function wallOf(base,pat){return `
  <rect width="300" height="${HZ}" fill="${base}"/><rect width="300" height="${HZ}" fill="url(#${pat})"/>
  <rect width="300" height="${HZ}" fill="url(#vig)"/>
  <rect y="${HZ-56}" width="300" height="56" fill="rgba(255,255,255,.5)"/>
  <path d="M0 ${HZ-56}h300" stroke="${L}" stroke-width="2" opacity=".45"/>
  ${[40,100,160,220,280].map(x=>`<rect x="${x-22}" y="${HZ-46}" width="44" height="34" rx="4" fill="none" stroke="${L}" stroke-width="1.5" opacity=".25"/>`).join('')}
  <rect y="${HZ-13}" width="300" height="13" fill="#F3E4D0"/><path d="M0 ${HZ-13}h300" stroke="${L}" stroke-width="2"/>`}
function tileFloor(){
  let o=`<rect y="${HZ}" width="300" height="${400-HZ}" fill="#DCE7EA"/>`,y=HZ,g=17;
  while(y<400){o+=`<path d="M0 ${y}h300" stroke="#C4D6DB" stroke-width="2"/>`;y+=g;g*=1.18}
  [40,100,160,220,280].forEach(x=>{o+=`<path d="M${x} ${HZ}L${x+(x-150)*0.5} 400" stroke="#C4D6DB" stroke-width="2"/>`});
  return o+`<path d="M0 ${HZ}h300" stroke="${L}" stroke-width="2.6"/><rect y="${HZ}" width="300" height="24" fill="#6B5340" opacity=".09"/>`}
function floorOf(a,b){let o='',y=HZ,g=15;while(y<400){o+=`<rect y="${y}" width="300" height="${g}" fill="${(Math.round(y)%2)?a:b}"/>`;y+=g;g*=1.16}
  for(let i=0;i<9;i++){const yy=HZ+18+i*20;if(yy<400)o+=`<path d="M${(i%2)?0:150} ${yy}h150" stroke="${L}" stroke-width="1.2" opacity=".2"/>`}
  return o+`<path d="M0 ${HZ}h300" stroke="${L}" stroke-width="2.6"/><rect y="${HZ}" width="300" height="26" fill="#6B5340" opacity=".1"/>`}
const win=(x,y,w,h)=>`
  <rect x="${x-7}" y="${y-7}" width="${w+14}" height="${h+14}" rx="9" fill="#EBD9BF" ${st}/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#skyG)" ${stT}/>
  <circle cx="${x+w*.26}" cy="${y+h*.28}" r="11" fill="#fff" opacity=".9"/>
  <path d="M${x} ${y+h*.74}q${w*.3}-16 ${w*.55} 0t${w*.45} 0v${h*.26}H${x}z" fill="#BFE3B4"/>
  <circle cx="${x+w*.74}" cy="${y+h*.6}" r="14" fill="#9FD8A8" ${stT}/>
  <path d="M${x+w/2} ${y}v${h}M${x} ${y+h/2}h${w}" stroke="${L}" stroke-width="2.4"/>
  <rect x="${x-13}" y="${y+h}" width="${w+26}" height="9" rx="4" fill="#E0BE93" ${st}/>
  <path d="M${x-9} ${y-4}q10 ${h*.5} 0 ${h+6}q16-6 20-${h*.5}t-4-${h*.52}z" fill="#F7D9E2" ${stT}/>
  <path d="M${x+w+9} ${y-4}q-10 ${h*.5} 0 ${h+6}q-16-6-20-${h*.5}t4-${h*.52}z" fill="#F7D9E2" ${stT}/>
  <path d="M${x-16} ${y-9}h${w+32}" stroke="${L}" stroke-width="3.4" stroke-linecap="round"/>`;

const ROOMS=[
 {k:'living',n:'Ruang Tamu',bg:DEFS+wallOf('#FBEADA','dots')+floorOf('#E3C097','#D9B387')+win(52,74,88,70)},
 {k:'bedroom',n:'Kamar Tidur',bg:DEFS+wallOf('#F4EDF8','floral')+floorOf('#E5C6A4','#DBB894')+win(150,76,88,68)},
 {k:'kitchen',n:'Dapur',bg:DEFS+wallOf('#F7F1E4','tile')+floorOf('#E0C6A8','#D5B99A')+win(158,68,86,66)+`
   <rect x="14" y="150" width="112" height="11" rx="4" fill="#E0BE93" ${st}/>
   <path d="M24 161v6M116 161v6" ${stT}/>
   <rect x="22" y="52" width="52" height="52" rx="6" fill="#FFFDF6" ${st}/>
   <path d="M48 52v52" stroke="${L}" stroke-width="2"/>
   <path d="M42 74v8M54 74v8" stroke="${L}" stroke-width="2.6" stroke-linecap="round"/>`},
 {k:'bathroom',n:'K. Mandi',bg:DEFS+wallOf('#EAF4F8','tile')+tileFloor()+win(176,62,80,64)+`
   <circle cx="72" cy="92" r="32" fill="#EBD9BF" ${st}/>
   <circle cx="72" cy="92" r="26" fill="#F4FBFD" ${stT}/>
   <path d="M58 80q12-8 22 3" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
   <path d="M110 46h56" stroke="${L}" stroke-width="3.6" stroke-linecap="round"/>
   <path d="M118 46q-5 22 2 34 12-5 10-19t-5-15z" fill="#F7D9E2" ${stT}/>
   <path d="M142 46q-5 20 2 32 11-5 9-18t-4-14z" fill="#A8CFE8" ${stT}/>`},
 {k:'garden',n:'Taman',bg:DEFS+`
   <rect width="300" height="${HZ}" fill="url(#skyG)"/>
   <circle cx="248" cy="46" r="30" fill="#FFF3C9" opacity=".95"/><circle cx="248" cy="46" r="20" fill="#FFE9A8" opacity=".8"/>
   <circle cx="56" cy="52" r="21" fill="#fff"/><circle cx="80" cy="56" r="16" fill="#fff"/><circle cx="38" cy="58" r="14" fill="#fff"/>
   <circle cx="196" cy="104" r="15" fill="#fff" opacity=".8"/><circle cx="212" cy="108" r="11" fill="#fff" opacity=".8"/>
   <path d="M110 88q8-7 16 0M126 88q8-7 16 0" fill="none" stroke="${L}" stroke-width="2.2" stroke-linecap="round" opacity=".5"/>
   <path d="M0 178q52-34 104-6t100-14 96 12v46H0z" fill="#CFE7C4"/>
   <path d="M0 196q60-26 118-4t92-10 90 10v34H0z" fill="#BFE3B4"/>
   ${Array.from({length:11},(_,i)=>`<rect x="${i*30+4}" y="${HZ-52}" width="9" height="52" rx="3" fill="#E0BE93" ${stT}/>`).join('')}
   <rect y="${HZ-40}" width="300" height="7" fill="#D0A876" ${stT}/><rect y="${HZ-22}" width="300" height="7" fill="#D0A876" ${stT}/>
   <rect y="${HZ}" width="300" height="${400-HZ}" fill="#AEDCA2"/><path d="M0 ${HZ}h300" stroke="#4E8A5E" stroke-width="2.6"/>
   <path d="M-10 ${HZ+46}q90 16 160 0t160 0" fill="none" stroke="#98CE8C" stroke-width="4"/>
   <path d="M-10 ${HZ+112}q100 18 170 0t150 0" fill="none" stroke="#98CE8C" stroke-width="4"/>
   ${Array.from({length:24},(_,i)=>{const x=(i*37)%300,y=HZ+18+((i*53)%140);return `<path d="M${x} ${y}q3-8 6 0" stroke="#7FBF8A" stroke-width="2" fill="none"/>`}).join('')}`},
 {k:'petroom',n:'Area Pet',bg:DEFS+wallOf('#FDF2E6','dots')+floorOf('#E7CBAA','#DCBE9C')+win(160,70,84,64)+`
   <rect x="26" y="52" width="94" height="42" rx="10" fill="#FFF7EA" ${st}/>
   <rect x="34" y="60" width="78" height="26" rx="7" fill="#F7D9E2" ${stT}/>
   <circle cx="58" cy="73" r="5.4" fill="#E294AC"/>
   <circle cx="53" cy="65" r="2.4" fill="#E294AC"/><circle cx="59" cy="63" r="2.4" fill="#E294AC"/><circle cx="65" cy="66" r="2.4" fill="#E294AC"/>
   <path d="M76 69h28M76 79h20" stroke="#E294AC" stroke-width="2.8" stroke-linecap="round"/>
   ${[[142,142],[160,164],[144,184]].map(([x,y])=>`<g opacity=".4"><circle cx="${x}" cy="${y}" r="4.4" fill="#C99A61"/>
     <circle cx="${x-4}" cy="${y-6}" r="2" fill="#C99A61"/><circle cx="${x+1}" cy="${y-8}" r="2" fill="#C99A61"/>
     <circle cx="${x+6}" cy="${y-5}" r="2" fill="#C99A61"/></g>`).join('')}`},
];

const CAT=[
 {k:'sofa_cream',n:'Sofa Krem',cat:'living',price:0,place:'floor',w:158,h:158,svg:S(`
   <rect x="10" y="40" width="18" height="36" rx="8" fill="#F1E2CC" ${st}/>
   <rect x="72" y="40" width="18" height="36" rx="8" fill="#F1E2CC" ${st}/>
   <path d="M14 46q6 14 0 26M84 46q-6 14 0 26" stroke="#DFCBAF" stroke-width="2" fill="none"/>
   <rect x="18" y="30" width="64" height="28" rx="10" fill="#FFF7EA" ${st}/>
   <path d="M50 32v24" stroke="#E9D6BC" stroke-width="2"/>
   <path d="M26 38q10-5 20 0M54 38q10-5 20 0" stroke="#E9D6BC" stroke-width="1.8" fill="none"/>
   <rect x="16" y="52" width="68" height="24" rx="9" fill="#FFFDF6" ${st}/>
   <path d="M50 54v20" stroke="#E9D6BC" stroke-width="2"/>
   <path d="M22 62q12-4 24 0M54 62q12-4 24 0" stroke="#EFE0C8" stroke-width="1.8" fill="none"/>
   <rect x="24" y="34" width="18" height="15" rx="6" fill="${C.pink}" transform="rotate(-7 33 41)" ${stT}/>
   <path d="M28 41q7-3 12 0" stroke="${C.pinkD}" stroke-width="1.6" fill="none" transform="rotate(-7 33 41)"/>
   <rect x="58" y="35" width="18" height="14" rx="6" fill="${C.blue}" transform="rotate(6 67 42)" ${stT}/>
   <path d="M62 42q7-3 12 0" stroke="${C.blueD}" stroke-width="1.6" fill="none" transform="rotate(6 67 42)"/>
   <path d="M22 76v8M78 76v8" stroke="${C.woodD}" stroke-width="4.4" stroke-linecap="round"/>`)},
 {k:'sofa_pink',n:'Sofa Pink',cat:'living',price:850,place:'floor',w:158,h:158,svg:S(`<rect x="12" y="46" width="76" height="30" rx="9" fill="${C.pink}" ${st}/>
    <rect x="18" y="34" width="64" height="26" rx="9" fill="#FBD3DE" ${st}/>
    <rect x="8"  y="42" width="16" height="30" rx="7" fill="${C.pink}" ${st}/>
    <rect x="76" y="42" width="16" height="30" rx="7" fill="${C.pink}" ${st}/>
    <path d="M22 76v6M78 76v6" ${st}/>`)},
 {k:'sofa_blue',n:'Sofa Biru',cat:'living',price:850,place:'floor',w:158,h:158,svg:S(`<rect x="12" y="46" width="76" height="30" rx="9" fill="${C.blue}" ${st}/>
    <rect x="18" y="34" width="64" height="26" rx="9" fill="#C9E3F2" ${st}/>
    <rect x="8"  y="42" width="16" height="30" rx="7" fill="${C.blue}" ${st}/>
    <rect x="76" y="42" width="16" height="30" rx="7" fill="${C.blue}" ${st}/>
    <path d="M22 76v6M78 76v6" ${st}/>`)},
 {k:'sofa_velvet',n:'Sofa Beludru',cat:'living',price:3200,place:'floor',w:166,h:166,svg:S(`<rect x="12" y="44" width="76" height="32" rx="11" fill="${C.lilac}" ${st}/>
    <rect x="18" y="30" width="64" height="28" rx="11" fill="#DCD0F2" ${st}/>
    <rect x="8"  y="40" width="16" height="32" rx="8" fill="${C.lilac}" ${st}/>
    <rect x="76" y="40" width="16" height="32" rx="8" fill="${C.lilac}" ${st}/>

const CATS=[['all','Semua'],['living','R. Tamu'],['kitchen','Dapur'],['bedroom','Kamar'],['bathroom','K. Mandi'],['garden','Taman'],['plants','Tanaman'],['lighting','Lampu'],['wall','Dinding'],['floor','Karpet'],['storage','Simpanan'],['deco','Hiasan'],['pet','Area Pet'],['seasonal','Musiman']];

/* ================= STATE ================= */
const SAVE='house_decor_v2';
// nama item lama -> baru (biar dekorasi yang udah dibuat ga ilang)
const MIGRATE={sofa:'sofa_cream',rug:'rug_round',table:'coffee_table',plant:'plant_small',
  frame:'wall_frame',bed:'bed_double',bench:'garden_bench',flowerbed:'flower_bed',
  armchair:'armchair',beanbag:'beanbag',cactus:'cactus',bonsai:'bonsai',lamp:'floor_lamp',
  lantern:'lantern',clock:'wall_clock',shelf:'wall_shelf',garland:'wall_garland',
  mirror:'wall_mirror_oval',bear:'plush_bear',candle:'candle_set',basket:'basket',
  petbed:'pet_bed',birdbath:'bird_bath',dining:'dining_table',rug_star:'rug_star'};

let coin=325000, room=0, mode=false, sel=null, ccat='all';
let owned=new Set(CAT.filter(i=>i.price===0).map(i=>i.k));
let placed={};
try{
  const d=JSON.parse(localStorage.getItem(SAVE)||localStorage.getItem('house_decor_v1')||'{}');
  if(d.placed)placed=d.placed;
  if(d.coin!=null)coin=d.coin;
  if(d.owned)owned=new Set(d.owned.map(k=>MIGRATE[k]||k).filter(k=>CAT.some(i=>i.k===k)));
}catch(e){}
// bersihkan: ganti nama lama, buang item yang udah ga ada di katalog
Object.keys(placed).forEach(rk=>{
  if(!Array.isArray(placed[rk])){placed[rk]=[];return}
  placed[rk]=placed[rk].map(p=>{
    if(!p||typeof p!=='object')return null;
    const k=MIGRATE[p.k]||p.k;
    return CAT.some(i=>i.k===k) ? {...p,k} : null;
  }).filter(Boolean);
});
CAT.filter(i=>i.price===0).forEach(i=>owned.add(i.k));
ROOMS.forEach(r=>{ if(!Array.isArray(placed[r.k])) placed[r.k]=[]; });
const save=()=>{try{localStorage.setItem(SAVE,JSON.stringify({placed,coin,owned:[...owned]}))}catch(e){}};
const item=k=>CAT.find(i=>i.k===k);
const $=id=>document.getElementById(id);

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('on'),2000)}

/* ================= RENDER ================= */
function renderRoom(){
  $('bg').innerHTML=ROOMS[room].bg;
  $('hSub').textContent=ROOMS[room].n;
  [...$('rooms').children].forEach((b,i)=>b.classList.toggle('on',i===room));
  renderItems();
}
function renderItems(){
  const box=$('items'); box.innerHTML='';
  const list=[...placed[ROOMS[room].k]];
  // karpet paling bawah, lalu urut Y (makin bawah makin depan)
  list.sort((a,b)=>{
    const ia=item(a.k), ib=item(b.k);
    const ra=!!ia&&ia.place==='rug', rb=!!ib&&ib.place==='rug';
    if(ra!==rb) return ra?-1:1;
    return (a.z||0)-(b.z||0) || a.y-b.y;
  });
  list.forEach(p=>{
    const it=item(p.k); if(!it) return;
    const d=document.createElement('div');
    d.className='it'+(sel===p.id?' sel':'');
    d.dataset.id=p.id;
    d.style.cssText=`left:${(p.x/300*100)}%;top:${(p.y/400*100)}%;width:${it.w/300*100}%;height:${it.h/400*100}%;
      transform:translate(-50%,-50%) scaleX(${p.flip?-1:1})`;
    let html=it.svg.replace('<svg','<svg width="100%" height="100%" preserveAspectRatio="xMidYMid meet"');
    if(it.photo){
      html = html.replace('__IMG__', p.img
        ? `<clipPath id="cp${p.id}"><rect x="24" y="24" width="52" height="52" rx="3"/></clipPath>
           <image href="${p.img}" x="24" y="24" width="52" height="52"
             preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${p.id})"/>`
        : `<g opacity=".55"><path d="M30 66l12-14 9 9 7-7 12 12z" fill="#9FD8A8"/>
           <circle cx="38" cy="38" r="5" fill="#FFD98A"/>
           <text x="50" y="72" font-size="7" text-anchor="middle" fill="#8A6C4E" font-family="sans-serif">tap 📷</text></g>`);
    }
    d.innerHTML=html;
    box.appendChild(d);
  });
  positionBar();
}
function positionBar(){
  const bar=$('obar');
  if(!mode||!sel){bar.classList.remove('on');return}
  const p=placed[ROOMS[room].k].find(x=>x.id===sel);
  if(!p){bar.classList.remove('on');return}
  const it=item(p.k);
  if(!it){bar.classList.remove('on');return}
  bar.style.left=(p.x/300*100)+'%';
  bar.style.top=Math.max(9,(p.y-it.h/2)/400*100)+'%';
  bar.classList.add('on');
  $('bPhoto').style.display = it.photo ? 'grid' : 'none';
}

/* ================= DRAG ================= */
const stage=$('stage');
let drag=null;
function toLocal(e){
  const r=stage.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*300, y:(e.clientY-r.top)/r.height*400};
}
function clampTo(p,it){
  if(!it)return;
  const hw=it.w/2, hh=it.h/2;
  p.x=Math.max(hw*0.35, Math.min(300-hw*0.35, p.x));
  if(it.place==='any'){                  // bebas: boleh nempel dinding atau di lantai
    p.y=Math.max(hh*0.5, Math.min(400-hh*0.3, p.y));
  }else if(it.place==='wall'){           // item dinding: tetap di area dinding
    p.y=Math.max(hh*0.6, Math.min(HZ-hh*0.35, p.y));
  }else{                                 // lantai & karpet: tetap di area lantai
    p.y=Math.max(HZ+hh*0.15, Math.min(400-hh*0.3, p.y));
  }
}
stage.addEventListener('pointerdown',e=>{
  if(!mode) return;
  if(e.target.closest('#obar')) return;   // jangan hapus seleksi kalau yang ditekan toolbar
  const el=e.target.closest('.it');
  if(!el){ sel=null; renderItems(); return; }
  const id=el.dataset.id;
  const p=placed[ROOMS[room].k].find(x=>x.id===id); if(!p) return;
  sel=id; renderItems();
  const l=toLocal(e);
  drag={id,dx:p.x-l.x,dy:p.y-l.y,moved:false};
  el.classList.add('drag');
  const it=item(p.k);
  if(!it){drag=null;return}
  if(it.place!=='any') $(it.place==='wall'?'zw':'zf').classList.add('on');
  stage.setPointerCapture(e.pointerId);
  e.preventDefault();
},{passive:false});
stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  const p=placed[ROOMS[room].k].find(x=>x.id===drag.id); if(!p) return;
  const it=item(p.k); if(!it){drag=null;return}
  const l=toLocal(e);
  p.x=l.x+drag.dx; p.y=l.y+drag.dy;
  clampTo(p,it);
  drag.moved=true;
  renderItems();
  e.preventDefault();
},{passive:false});
function endDrag(){
  if(!drag) return;
  drag=null; save();
  $('zw').classList.remove('on'); $('zf').classList.remove('on');
  document.querySelectorAll('.it.drag').forEach(d=>d.classList.remove('drag'));
  renderItems();
}
stage.addEventListener('pointerup',endDrag);
stage.addEventListener('pointercancel',endDrag);

/* ================= AKSI ================= */
function withSel(fn){
  const arr=placed[ROOMS[room].k];
  const p=arr.find(x=>x.id===sel); if(!p) return;
  fn(p,arr); save(); renderItems();
}
const fileIn=document.createElement('input');
fileIn.type='file'; fileIn.accept='image/*'; fileIn.style.display='none';
document.body.appendChild(fileIn);
$('bPhoto').onclick=()=>{ if(sel) fileIn.click(); };
fileIn.onchange=()=>{
  const f=fileIn.files&&fileIn.files[0]; if(!f||!sel) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
      // kecilkan biar hemat ruang simpan
      const cv=document.createElement('canvas'), S2=260;
      const sc=Math.min(S2/img.width,S2/img.height,1);
      cv.width=img.width*sc; cv.height=img.height*sc;
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      withSel(p=>{p.img=cv.toDataURL('image/jpeg',.8)});
      toast('Foto dipasang ✨');
    }; img.src=rd.result; };
  rd.readAsDataURL(f); fileIn.value='';
};
$('bFlip').onclick=()=>withSel(p=>{p.flip=!p.flip});
$('bUp').onclick=()=>withSel(p=>{p.z=(p.z||0)+1});
$('bDown').onclick=()=>withSel(p=>{p.z=(p.z||0)-1});
$('bDel').onclick=()=>withSel((p,arr)=>{arr.splice(arr.indexOf(p),1);sel=null;toast('Disimpan kembali ke koleksi')});

$('btnMode').onclick=()=>{
  mode=!mode; sel=null;
  $('btnMode').textContent = mode?'✅ Selesai':'✋ Mode Dekor';
  $('btnMode').classList.toggle('primary',mode);
  toast(mode?'Geser furniture buat pindahin':'Mode dekor selesai');
  renderItems();
};

/* katalog */
function openSheet(o){$('sheet').classList.toggle('on',o);$('mask').classList.toggle('on',o)}
$('btnShop').onclick=()=>{renderCat();openSheet(true)};
$('closeSheet').onclick=()=>openSheet(false);
$('mask').onclick=()=>openSheet(false);
function renderCat(){
  $('cats').innerHTML=CATS.map(([k,l])=>`<button class="ct${k===ccat?' on':''}" data-k="${k}">${l}</button>`).join('');
  [...$('cats').children].forEach(b=>b.onclick=()=>{ccat=b.dataset.k;renderCat()});
  const list=ccat==='all'?CAT:CAT.filter(i=>i.cat===ccat);
  $('cgrid').innerHTML=list.map(i=>{
    const own=owned.has(i.k);
    return `<div class="ci${own?' owned':''}" data-k="${i.k}">
      <div class="th">${i.svg}</div><div class="nm">${i.n}</div>
      <div class="pr ${i.price===0?'free':''}">${own?'Dimiliki':(i.price===0?'GRATIS':i.price.toLocaleString('id-ID')+' 🪙')}</div>
    </div>`}).join('');
  [...$('cgrid').children].forEach(c=>c.onclick=()=>addItem(c.dataset.k));
}
function addItem(k){
  const it=item(k);
  if(!it){toast('Item tidak ditemukan');return}
  if(!owned.has(k)){
    if(coin<it.price){toast('🪙 Koin belum cukup');return}
    coin-=it.price; owned.add(k); $('coin').textContent=coin.toLocaleString('id-ID');
    toast(`Dibeli: ${it.n}`);
  }
  const p={id:'p'+Date.now()+Math.random().toString(36).slice(2,6),k,
    x:150, y: it.place==='wall'? 120 : (it.place==='any'? 250 : 320), flip:false, z:0};
  clampTo(p,it);
  placed[ROOMS[room].k].push(p);
  sel=p.id; if(!mode){mode=true;$('btnMode').textContent='✅ Selesai';$('btnMode').classList.add('primary')}
  save(); renderItems(); openSheet(false);
  toast('Geser buat atur posisinya');
}

/* ruangan */
$('rooms').innerHTML=ROOMS.map((r,i)=>`<button class="rm${i?'':' on'}">${r.n}</button>`).join('');
[...$('rooms').children].forEach((b,i)=>b.onclick=()=>{room=i;sel=null;renderRoom()});
$('back').onclick=()=>toast('(nanti balik ke menu rumah)');
$('coin').textContent=coin.toLocaleString('id-ID');

/* isi contoh awal kalau masih kosong */
if(!placed.living.length){
  placed.living=[
    {id:'a1',k:'rug_round',x:154,y:344,flip:false,z:0},
    {id:'a2',k:'sofa_cream',x:112,y:286,flip:false,z:0},
    {id:'a3',k:'coffee_table',x:232,y:322,flip:false,z:0},
    {id:'a4',k:'plant_tall',x:36,y:300,flip:false,z:0},
    {id:'a5',k:'wall_frame',x:238,y:120,flip:false,z:0},
    {id:'a6',k:'floor_lamp',x:214,y:258,flip:false,z:0}
  ];
  placed.bedroom=[{id:'b1',k:'bed_double',x:130,y:300,flip:false,z:0},{id:'b2',k:'nightstand',x:246,y:322,flip:false,z:0}];
  placed.garden=[{id:'c1',k:'garden_bench',x:96,y:308,flip:false,z:0},{id:'c2',k:'flower_bed',x:222,y:326,flip:false,z:0}];
  save();
}
renderRoom();
window.__st={placed,ROOMS,CAT,get room(){return room},get sel(){return sel},get mode(){return mode}};
</script>
